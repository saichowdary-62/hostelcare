<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Aditya University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <span class="brand-name">Aditya University</span>
      </div>
      <nav class="topnav-links">
        <a href="student-dashboard.html">Home</a>
        <a href="create-complaint.html">Create Complaint</a>
        <a href="complaints.html">My Complaints</a>
        <a href="profile.html" class="active">Profile</a>
      </nav>
      <div class="topnav-actions">
        <button class="avatar-btn" id="avatarBtn">--</button>
      </div>
    </div>
  </header>

  <main class="page-content" style="max-width:560px;">
    <div class="card profile-card">
      <div class="profile-avatar" id="profileAvatar">--</div>
      <h2 id="profileName">—</h2>
      <p id="profileId">—</p>
    </div>

    <div class="card mb-6">
      <h3 style="font-size:14px; margin-bottom:16px;">Student Information</h3>
      <div class="info-list">
        <div class="info-row"><span class="info-label">Student ID</span><span class="info-value" id="infoId">—</span></div>
        <div class="info-row"><span class="info-label">Full Name</span><span class="info-value" id="infoName">—</span></div>
        <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="infoEmail">—</span></div>
        <div class="info-row"><span class="info-label">Phone</span><span class="info-value" id="infoPhone">—</span></div>
        <div class="info-row"><span class="info-label">Hostel</span><span class="info-value" id="infoHostel">—</span></div>
        <div class="info-row"><span class="info-label">Block</span><span class="info-value" id="infoBlock">—</span></div>
        <div class="info-row"><span class="info-label">Floor</span><span class="info-value" id="infoFloor">—</span></div>
        <div class="info-row"><span class="info-label">Room Number</span><span class="info-value" id="infoRoom">—</span></div>
      </div>
    </div>

    <button class="btn btn-danger-outline btn-block" id="logoutBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Logout
    </button>
  </main>

  <div class="bottom-nav-spacer"></div>
  <nav class="bottom-nav">
    <a href="student-dashboard.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5H10v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="create-complaint.html" class="fab-link">
      <div class="fab-create">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <span>Create</span>
    </a>
    <a href="complaints.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Complaints</span>
    </a>
    <a href="profile.html" class="active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>

<script src="js/script.js"></script>
<script>
  const session = HC.requireStudent();
  if (session) {
    const student = HC.getStudentById(session.studentId);
    document.getElementById("avatarBtn").textContent = HC.initials(student.name);
    document.getElementById("profileAvatar").textContent = HC.initials(student.name);
    document.getElementById("profileName").textContent = student.name;
    document.getElementById("profileId").textContent = student.studentId;

    document.getElementById("infoId").textContent = student.studentId;
    document.getElementById("infoName").textContent = student.name;
    document.getElementById("infoEmail").textContent = student.email;
    document.getElementById("infoPhone").textContent = student.phone;
    document.getElementById("infoHostel").textContent = student.hostel;
    document.getElementById("infoBlock").textContent = student.block;
    document.getElementById("infoFloor").textContent = student.floor;
    document.getElementById("infoRoom").textContent = student.room;

    document.getElementById("logoutBtn").addEventListener("click", () => HC.logout("index.html"));
  }
</script>
</body>
</html>
