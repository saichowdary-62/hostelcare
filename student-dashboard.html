<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Aditya University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- Top Navigation -->
  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <span class="brand-name">Aditya University</span>
      </div>
      <nav class="topnav-links">
        <a href="student-dashboard.html" class="active">Home</a>
        <a href="create-complaint.html">Create Complaint</a>
        <a href="complaints.html">My Complaints</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <button class="avatar-btn" id="avatarBtn" title="Profile" onclick="window.location.href='profile.html'">--</button>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="welcome-card" id="welcomeCard">
      <h1>Welcome back!</h1>
      <p>Here's an overview of your maintenance requests.</p>
      <div class="welcome-meta" id="welcomeMeta"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon tone-total">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Complaints</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon tone-pending">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon tone-progress">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5l-2 2M8.5 15.5l-2 2m0-11l2 2m9 9l-2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div class="stat-value" id="statProgress">0</div>
        <div class="stat-label">Under Repair</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon tone-completed">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="stat-value" id="statCompleted">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <div class="section-heading">
      <h2>Recent Complaints</h2>
      <a href="complaints.html" class="link-more">View all</a>
    </div>
    <div id="recentList"></div>

    <a href="create-complaint.html" class="btn btn-primary btn-block hide-mobile dashboard-create-action">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Create Complaint
    </a>
  </main>

  <div class="bottom-nav-spacer"></div>

  <!-- Bottom Navigation (mobile) -->
  <nav class="bottom-nav">
    <a href="student-dashboard.html" class="active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5H10v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="create-complaint.html" class="fab-link" aria-label="Create Complaint">
      <div class="fab-create">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <span>Create</span>
    </a>
    <a href="complaints.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Complaints</span>
    </a>
    <a href="profile.html" class="hide-nav-profile">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/script.js"></script>
<script>
  const session = HC.requireStudent();
  if (session) {
    const student = HC.getStudentById(session.studentId);

    document.getElementById("avatarBtn").textContent = HC.initials(student.name);
    document.getElementById("welcomeCard").querySelector("h1").textContent = "Welcome back, " + student.name.split(" ")[0] + "!";
    document.getElementById("welcomeMeta").innerHTML = `
      <div><span>Hostel</span><strong>${HC.escapeHtml(student.hostel)}</strong></div>
      <div><span>Room</span><strong>${HC.escapeHtml(student.room)} · ${HC.escapeHtml(student.floor)}</strong></div>
      <div><span>Block</span><strong>${HC.escapeHtml(student.block)}</strong></div>
    `;

    (async () => {
      const complaints = await HC.fetchStudentComplaints(session.studentId);
      document.getElementById("statTotal").textContent = complaints.length;
      document.getElementById("statPending").textContent = complaints.filter(c => c.status === "Pending").length;
      document.getElementById("statProgress").textContent = complaints.filter(c => c.status === "Under Repair").length;
      document.getElementById("statCompleted").textContent = complaints.filter(c => c.status === "Completed").length;

      const recent = complaints.slice(0, 3);
      const recentList = document.getElementById("recentList");
      if (recent.length === 0) {
        recentList.innerHTML = `
          <div class="card empty-state">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <h3>No complaints yet</h3>
            <p>Report your first maintenance issue to get started.</p>
          </div>`;
      } else {
        recentList.innerHTML = recent.map(c => `
          <div class="complaint-card card-hover" onclick="window.location.href='complaint-details.html?id=${c.rawId}'">
            <div class="complaint-card-top">
              <div>
                <div class="complaint-card-id">${c.id}</div>
                <div class="complaint-card-title">${HC.escapeHtml(c.category)}</div>
              </div>
              <span class="badge ${HC.badgeClass(c.status)}">${c.status}</span>
            </div>
            <div class="complaint-card-meta">
              <span>Room ${HC.escapeHtml(c.room)}</span>
              <span>${HC.formatDate(c.createdAt)}</span>
            </div>
          </div>
        `).join("");
      }
    })();
  }
</script>
</body>
</html>
